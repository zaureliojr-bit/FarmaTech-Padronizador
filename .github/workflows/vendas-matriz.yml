name: Extrator vendas matriz
on:
  push:
    branches: ['drogalink/vendas-matriz']
    paths:
      - 'firebird-extrator/**'
      - '.github/workflows/vendas-matriz.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: firebird-extrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check vendas-matriz.js
      - run: node -e "if (require('node-firebird').ISOLATION_READ_COMMITTED_READ_ONLY == null) process.exit(1)"
      - run: npx --no-install pkg vendas-matriz.js --targets node18-win-x64 --output dist/extrator-vendas-matriz.exe
      - uses: actions/upload-artifact@v4
        with:
          name: extrator-vendas-matriz-windows
          path: firebird-extrator/dist/extrator-vendas-matriz.exe
          if-no-files-found: error
