
name: Extrator compras incremental

on:
  push:
    branches: ['drogalink/compras-incremental']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: firebird-extrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check extrair.js
      - run: npm run build:exe
      - run: Rename-Item dist/extrator.exe extrator-compras-incremental.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: extrator-compras-incremental-windows
          path: firebird-extrator/dist/extrator-compras-incremental.exe
          if-no-files-found: error
